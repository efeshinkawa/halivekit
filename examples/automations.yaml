# Example HA LiveKit automations.
# Most users should use ha_livekit.set_activity for starts and updates.
# Replace entity IDs with your own Home Assistant entities.

- id: ha_livekit_front_door
  alias: "HA LiveKit - Front door"
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door
  action:
    - action: ha_livekit.set_activity
      data:
        activity_id: front_door
        entity_id: binary_sensor.front_door
        template: door

- id: ha_livekit_front_door_closed
  alias: "HA LiveKit - Front door closed"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door
      to: "off"
      for: "00:00:10"
  action:
    - action: ha_livekit.end_activity
      data:
        activity_id: front_door

- id: ha_livekit_washing_machine
  alias: "HA LiveKit - Washing machine"
  mode: restart
  trigger:
    - platform: state
      entity_id:
        - sensor.washing_machine_power
        - sensor.washing_machine_progress
  action:
    - action: ha_livekit.set_activity
      data:
        activity_id: washing_machine
        entity_id: sensor.washing_machine_power
        template: laundry
        progress_entity_id: sensor.washing_machine_progress

- id: ha_livekit_custom_status
  alias: "HA LiveKit - Custom status"
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.custom_status
      to: "on"
  action:
    - action: ha_livekit.set_activity
      data:
        activity_id: custom_status
        title: "Custom Status"
        subtitle: "Started from Home Assistant"
        state: "Running"
        template: progress

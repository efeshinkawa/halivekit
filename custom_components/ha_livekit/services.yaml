set_activity:
  name: Set Live Activity
  description: Recommended action. Starts a Live Activity if it does not exist, or updates the existing one with the same activity ID. Entity-backed calls follow Home Assistant entity read permissions. Limited users receive entity-derived content only; custom display overrides and entityless content require an administrator or a trusted automation/system context.
  fields:
    activity_id:
      name: Activity ID
      description: Optional when Entity is selected; otherwise required. When omitted for an entity, HA LiveKit derives a stable ID from the entity ID so repeated calls update the same activity.
      required: false
      example: front_door
      selector:
        text:
    entity_id:
      name: Entity
      description: Optional Home Assistant entity used to build the Live Activity state automatically.
      required: false
      example: binary_sensor.front_door
      selector:
        entity:
    allow_entity_control:
      name: Show On/Off controls
      description: Opt in to On and Off buttons for a light, switch, or input_boolean. The iOS app must remain connected to this Home Assistant instance. Applies when a new Live Activity starts; end and restart an existing activity to change this setting. Administrator or trusted automation/system context required.
      required: true
      default: false
      selector:
        boolean:
    template:
      name: Template
      description: Visual template hint. Leave empty to infer from the entity when possible.
      required: false
      default: custom
      selector:
        select:
          options:
            - custom
            - progress
            - door
            - laundry
            - washing_machine
            - dishwasher
            - vacuum
            - security
            - climate
            - energy
            - timer
    title:
      name: Title
      description: Optional title. For entity activities this defaults to the entity friendly name.
      required: false
      example: Door Alert
      selector:
        text:
    display_name:
      name: Display name
      description: Optional friendly label shown in the Live Activity.
      required: false
      example: Front Door
      selector:
        text:
    subtitle:
      name: Subtitle
      description: Optional short status line.
      required: false
      example: Opened
      selector:
        text:
    state:
      name: State
      description: Optional custom state text. Entity activities read the current entity state automatically when this is empty.
      required: false
      example: Running
      selector:
        text:
    progress_entity_id:
      name: Progress entity
      description: Optional entity whose numeric state should be used as progress. Percent values are converted to 0.0-1.0 automatically.
      required: false
      example: sensor.washing_machine_progress
      selector:
        entity:
    progress:
      name: Progress override
      description: Optional progress value from 0.0 to 1.0.
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
    icon_name:
      name: Icon
      description: Optional SF Symbol override, e.g. lightbulb.fill or door.left.hand.open.
      required: false
      advanced: true
      selector:
        text:
    data:
      name: Extra data
      description: Advanced optional data such as icon_name, display_style, theme, secondary_state or unit.
      required: false
      advanced: true
      selector:
        object:
    end_when:
      name: End when
      description: Optional advanced metadata for future auto-end rules. HA LiveKit includes it in the payload but does not end activities automatically from this field.
      required: false
      advanced: true
      selector:
        object:
    device_id:
      name: Device ID
      description: Optional advanced routing field. Leave empty to broadcast to any connected HA LiveKit iOS app.
      required: false
      advanced: true
      selector:
        text:

start_activity:
  name: Start Live Activity
  description: Advanced raw/custom action for administrators and trusted automation/system contexts. Explicitly starts a custom Live Activity. Limited users should use Set Live Activity with an entity or Start Entity Live Activity.
  fields:
    activity_id:
      name: Activity ID
      description: Stable ID for this Live Activity, e.g. front_door or washing_machine.
      required: true
      example: front_door
      selector:
        text:
    entity_id:
      name: Entity
      description: Optional but recommended Home Assistant entity that should keep updating this activity.
      required: false
      example: binary_sensor.front_door
      selector:
        entity:
    allow_entity_control:
      name: Show On/Off controls
      description: Opt in to On and Off buttons for a light, switch, or input_boolean. The iOS app must remain connected to this Home Assistant instance. Applies only when this call starts a new Live Activity. Administrator or trusted automation/system context required.
      required: true
      default: false
      selector:
        boolean:
    title:
      name: Title
      description: Live Activity heading, e.g. Door Alert or Laundry.
      required: false
      example: Door Alert
      selector:
        text:
    display_name:
      name: Display name
      description: Friendly label for the entity shown in the Live Activity.
      required: false
      example: Front Door
      selector:
        text:
    subtitle:
      name: Subtitle
      description: Short status line, e.g. Opened or Running.
      required: false
      example: Opened
      selector:
        text:
    template:
      name: Template
      description: Visual template hint for the iOS app.
      required: false
      default: custom
      selector:
        select:
          options:
            - custom
            - progress
            - door
            - laundry
            - washing_machine
            - dishwasher
            - vacuum
            - security
            - climate
            - energy
            - timer
    state:
      name: State
      description: Optional initial state text to show immediately.
      required: false
      example: Open
      selector:
        text:
    progress:
      name: Progress
      description: Optional progress value from 0.0 to 1.0.
      required: false
      example: 0.42
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
    data:
      name: Extra data
      description: Advanced optional data such as icon_name, display_style, theme, secondary_state or unit.
      required: false
      selector:
        object:
    device_id:
      name: Device ID
      description: Optional advanced routing field. Leave empty to broadcast to any connected HA LiveKit iOS app.
      required: false
      advanced: true
      selector:
        text:


end_activity:
  name: End Live Activity
  description: Administrator or trusted automation/system action that ends an existing HA LiveKit Live Activity by activity ID.
  fields:
    activity_id:
      name: Activity ID
      description: Stable ID for the Live Activity to end, e.g. front_door or washing_machine.
      required: true
      example: washing_machine
      selector:
        text:
    reason:
      name: Reason
      description: Optional reason for diagnostics, e.g. finished or dismissed.
      required: false
      default: ended
      example: finished
      selector:
        text:
    device_id:
      name: Device ID
      description: Optional advanced routing field. Leave empty to broadcast to any connected HA LiveKit iOS app.
      required: false
      advanced: true
      selector:
        text:

configure_managed_relay:
  name: Internal Relay Setup
  description: Internal authenticated-admin-only setup used by the iOS app. Calls without a known administrator are rejected. You normally do not need to add this action manually.
  fields:
    relay_url:
      name: Managed relay URL
      description: Managed relay base URL provided by the HA LiveKit app.
      required: true
      advanced: true
      selector:
        text:
          type: url
    relay_shared_secret:
      name: Managed relay credential
      description: Legacy per-instance relay credential. New managed relay setup generates this inside Home Assistant instead.
      required: false
      advanced: true
      selector:
        text:
          type: password
    relay_app_registration_secret:
      name: Managed relay app registration credential
      description: App registration credential used by Home Assistant to provision the HA-owned relay credential.
      required: false
      advanced: true
      selector:
        text:
          type: password
    relay_environment:
      name: Relay environment
      description: APNs environment for this app build.
      required: false
      default: sandbox
      advanced: true
      selector:
        select:
          options:
            - sandbox
            - production
    home_assistant_instance_id:
      name: Home Assistant instance ID
      description: Internal per-home relay isolation identifier provided by the HA LiveKit iOS app.
      required: true
      advanced: true
      selector:
        text:

  description: Advanced raw/custom action for administrators and trusted automation/system contexts. Explicitly updates an existing custom Live Activity. Limited users should use Set Live Activity with an entity or Update Entity Live Activity.
  fields:
    activity_id:
      name: Activity ID
      description: Stable ID for the Live Activity to update, e.g. front_door or washing_machine.
      required: true
      example: washing_machine
      selector:
        text:
    entity_id:
      name: Entity
      description: Optional Home Assistant entity associated with this update.
      required: false
      example: sensor.washing_machine_status
      selector:
        entity:
    title:
      name: Title
      description: Optional replacement heading.
      required: false
      selector:
        text:
    display_name:
      name: Display name
      description: Optional replacement friendly entity label.
      required: false
      selector:
        text:
    subtitle:
      name: Subtitle
      description: Short status line, e.g. Door closed or 12 min remaining.
      required: false
      example: 12 min remaining
      selector:
        text:
    template:
      name: Template
      description: Optional visual template hint.
      required: false
      selector:
        select:
          options:
            - custom
            - progress
            - door
            - laundry
            - washing_machine
            - dishwasher
            - vacuum
            - security
            - climate
            - energy
            - timer
    state:
      name: State
      description: Primary state text shown in the Live Activity.
      required: false
      example: Running
      selector:
        text:
    progress:
      name: Progress
      description: Progress value from 0.0 to 1.0.

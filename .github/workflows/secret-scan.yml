name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${tarball}" "${release}/${tarball}"
          curl -sSfL -o checksums.txt "${release}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          config=.gitleaks.toml
          if [ -n "${BASE_REF}" ]; then
            # Scan pull requests with the base branch allowlist so a PR cannot exempt its own findings.
            git show "origin/${BASE_REF}:.gitleaks.toml" > "${RUNNER_TEMP}/gitleaks-base.toml"
            config="${RUNNER_TEMP}/gitleaks-base.toml"
          fi
          ./gitleaks git --redact --no-banner --config "${config}" .
